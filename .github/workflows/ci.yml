name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: Windows
            os: windows-latest
            target: windows
          - name: macOS
            os: macos-latest
            target: macos

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      # FFmpeg here is only for the conversion tests. The app does not bundle
      # FFmpeg yet; see docs/ROADMAP.md.
      - name: Install build tools and FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --exclude-tags "ffmpeg || screenshots"

      # Real conversions with the installed FFmpeg. These have only been run
      # on Linux so far, so a failure on the other systems is reported without
      # failing the build until they have been made to pass there.
      - name: Conversion tests
        run: flutter test --tags ffmpeg
        continue-on-error: ${{ runner.os != 'Linux' }}

      - name: Build
        run: flutter build ${{ matrix.target }} --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C build/linux/x64/release -czf tvv-videoconvertor-linux-x64.tar.gz bundle

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tvv-videoconvertor-windows-x64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/tvv_videoconvertor.app tvv-videoconvertor-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tvv-videoconvertor-${{ matrix.target }}
          path: |
            tvv-videoconvertor-*.tar.gz
            tvv-videoconvertor-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: tvv-videoconvertor-*
